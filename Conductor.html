<!DOCTYPE html>

    <style>
        body {

        #stage-video {

<body>

    <!-- 隐藏的视频元素 -->

    <!-- 纸张质感背景 -->

    <!-- 人物容器 -->

        <!-- 椭圆形舞台 - 显示摄像头画面 -->
        <div id="stage-ellipse">
            <video id="stage-video" playsinline autoplay></video>
        </div>
    </div>

    <!-- 3D画布 -->

            <div style="margin-bottom:10px; font-size:12px; color:#666; border-bottom:1px solid #d4a574; padding-bottom:5px;">CHANNEL STATUS</div>
            <div id="ch-left-index" class="channel-indicator" style="color: #ffcc00"><div class="dot"></div>DRUM</div>
            <div id="ch-left-middle" class="channel-indicator" style="color: #00ff00"><div class="dot"></div>PIANO</div>
            <div id="ch-right-index" class="channel-indicator" style="color: #00ffff"><div class="dot"></div>STRINGS</div>

        <div id="energy-container" class="hidden">
            <div id="bpm-display">0 BPM</div>

        </div>

        <div id="center-controls">
            <button id="start-btn">START CONDUCTING</button>

<script>
// ================= 配置区域 =================
const HISTORY_SIZE = 90; // ~1.5 seconds at 60fps for smoother BPM display
const MIN_BPM = 60;
const MAX_BPM = 180;
const STOP_THRESHOLD = 0.005;

let currentState = 'IDLE';
let scene, camera, renderer;
let handMeshes = { left: null, right: null };
let channels = {};
let recorder, analyser, particleSystem;
let speedHistory = new Array(HISTORY_SIZE).fill(0);
let previousHandPositions = { left: null, right: null };
let fistHoldFrameCount = 0;
let frameCount = 0;
let currentPlaybackRate = 1.0;

// 摄像机 Z 轴距离
const CAM_Z = 8;

// ================= 创建人物排列 =================
// 人物图片配置
const CHARACTER_IMAGES = {
    inactive: 'https://files.catbox.moe/i6hqly.png',  // 静止状态（未演奏）
    active: 'https://files.catbox.moe/1gsyg3.png'     // 激活状态（演奏时）
};

function createCharacters() {
    const container = document.getElementById('characters-container');

    // 使用Figma原始坐标
    // 左手食指 → 最左2人, 左手中指 → 左中2人
    // 右手食指 → 右中2人, 右手中指 → 最右2人
    const positions = [
        { left: 0, top: 358.85, rotate: 2.91, flip: false, finger: 'left_index' },        // Body08
        { left: 176.47, top: 309.76, rotate: 2.91, flip: false, finger: 'left_index' },   // Body07
        { left: 351.93, top: 287.2, rotate: 2.91, flip: false, finger: 'left_middle' },   // Body06
        { left: 533.4, top: 268.64, rotate: 2.91, flip: false, finger: 'left_middle' },   // Body05 左
        { left: 712, top: 269, rotate: -2.91, flip: true, finger: 'right_index' },        // Body05 右
        { left: 895, top: 287.2, rotate: -2.91, flip: true, finger: 'right_index' },      // Body02
        { left: 1072, top: 309.76, rotate: -2.91, flip: true, finger: 'right_middle' },   // Body03
        { left: 1248, top: 335.85, rotate: -2.91, flip: true, finger: 'right_middle' }    // Body04
    ];

    positions.forEach((pos, i) => {
        const character = document.createElement('div');
        character.className = 'character';
        // 默认使用静止状态图片
        character.style.backgroundImage = `url('${CHARACTER_IMAGES.inactive}')`;
        character.style.left = `${pos.left}px`;
        character.style.top = `${pos.top}px`;

        // 存储原始位置和手指类型
        character.dataset.originalTop = pos.top;
        character.dataset.finger = pos.finger;
        character.dataset.isActive = 'false';

        // 构建transform - 先旋转再翻转
        let transforms = [];
        if (pos.rotate !== 0) {
            transforms.push(`rotate(${pos.rotate}deg)`);
        }
        if (pos.flip) {
            transforms.push('scaleX(-1)');
        }
        if (transforms.length > 0) {
            character.style.transform = transforms.join(' ');
        }

        // 添加延迟动画效果和位置过渡
        character.style.opacity = '0';
        character.style.transition = `opacity 0.5s ease ${i * 0.1}s, top 0.3s ease`;

        container.appendChild(character);

        // 延迟显示
        setTimeout(() => {
            character.style.opacity = '1';
        }, 100 + i * 100);
    });
}

// ================= 视口计算工具 =================
function getVisiblePlane(depth, camera) {
    const vFOV = camera.fov * Math.PI / 180;
    const height = 2 * Math.tan(vFOV / 2) * depth;
    const width = height * camera.aspect;
    return { width, height };
}

// ================= Three.js 骨骼类 =================
class Hand3D {
    constructor(scene) {
        this.scene = scene;
        this.joints = [];
        this.bones = [];

        const jointGeo = new THREE.SphereGeometry(0.12, 16, 16);
        for(let i=0; i<21; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const mesh = new THREE.Mesh(jointGeo, mat);
            this.scene.add(mesh);
            this.joints.push(mesh);
        }

        const connections = [[0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [0,9],[9,10],[10,11],[11,12], [0,13],[13,14],[14,15],[15,16], [0,17],[17,18],[18,19],[19,20], [5,9],[9,13],[13,17]];
        connections.forEach(pair => {
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]),
                new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, linewidth: 2 })
            );
            line.userData = { start: pair[0], end: pair[1] };
            this.scene.add(line);
            this.bones.push(line);
        });
    }

    update(landmarks) {
        const visible = getVisiblePlane(CAM_Z, camera);

        landmarks.forEach((lm, i) => {
            const x = (0.5 - lm.x) * visible.width;
            const y = (0.5 - lm.y) * visible.height;
            const z = -lm.z * 15;

            this.joints[i].position.set(x, y, z);
            this.joints[i].visible = true;
        });

        this.bones.forEach(bone => {
            bone.geometry.setFromPoints([this.joints[bone.userData.start].position, this.joints[bone.userData.end].position]);
            bone.visible = true;
        });

        this.updateColors(landmarks);
    }

    updateColors(landmarks) {
        // 所有骨骼和关节保持统一黑色
        const color = 0x000000; // 黑色
        const opacity = 0.8;

        this.joints.forEach(joint => {
            joint.material.color.setHex(color);
        });

        this.bones.forEach(bone => {
            bone.material.color.setHex(color);
            bone.material.opacity = opacity;
        });
    }

    hide() { this.joints.forEach(j=>j.visible=false); this.bones.forEach(b=>b.visible=false); }
}

function initThree() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.z = CAM_Z;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    handMeshes.left = new Hand3D(scene);
    handMeshes.right = new Hand3D(scene);

    const light = new THREE.PointLight(0xffffff, 1, 100);
    light.position.set(0, 0, 10);
    scene.add(light);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

// ================= 音频逻辑 =================
async function initAudio() {
    await Tone.start();
    recorder = new Tone.Recorder();

    // Load the 4 audio files using GrainPlayer (supports independent speed and pitch control)
    channels.drum = new Tone.GrainPlayer({
        url: "https://raw.githubusercontent.com/yuanzhishan551-source/Conductor-/main/1123398047-1-16_drum_split_by_lalalai.mp4",
        loop: true,
        grainSize: 0.1,
        overlap: 0.05
    }).toDestination().connect(recorder);

    channels.piano = new Tone.GrainPlayer({
        url: "https://raw.githubusercontent.com/yuanzhishan551-source/Conductor-/main/1123398047-1-16_piano_split_by_lalalai.mp3",
        loop: true,
        grainSize: 0.1,
        overlap: 0.05
    }).toDestination().connect(recorder);

    channels.strings = new Tone.GrainPlayer({
        url: "https://raw.githubusercontent.com/yuanzhishan551-source/Conductor-/main/1123398047-1-16_strings_split_by_lalalai.mp4",
        loop: true,
        grainSize: 0.1,
        overlap: 0.05
    }).toDestination().connect(recorder);

    channels.wind = new Tone.GrainPlayer({
        url: "https://raw.githubusercontent.com/yuanzhishan551-source/Conductor-/main/1123398047-1-16_wind_split_by_lalalai.mp4",
        loop: true,
        grainSize: 0.1,
        overlap: 0.05
    }).toDestination().connect(recorder);

    // Start with all volumes at -Infinity
    channels.drum.volume.value = -Infinity;
    channels.piano.volume.value = -Infinity;
    channels.strings.volume.value = -Infinity;
    channels.wind.volume.value = -Infinity;

    Tone.Destination.volume.value = -Infinity;

    // Wait for all players to load
    await Promise.all([Tone.loaded()]);

    // Start all players
    channels.drum.start();
    channels.piano.start();
    channels.strings.start();
    channels.wind.start();
}

// ================= 交互处理 =================
function processConducting(results) {
    const hands = results.multiHandLandmarks;
    const handedness = results.multiHandedness;

    handMeshes.left.hide(); handMeshes.right.hide();
    let currentLeftPos = null, currentRightPos = null;

    if (hands.length > 0) {
        hands.forEach((lm, i) => {
            const label = handedness[i].label;

            // 因为镜像效果，MediaPipe的label需要反过来
            // MediaPipe 'Right' = 用户左手
            // MediaPipe 'Left' = 用户右手
            if (label === 'Right') {
                handMeshes.left.update(lm);  // 显示在左侧
                currentLeftPos = lm[0];
            } else {
                handMeshes.right.update(lm);  // 显示在右侧
                currentRightPos = lm[0];
            }
        });
    }

    calculateDynamics(currentLeftPos, currentRightPos);
    updateChannelSwitches(hands, handedness);
    checkStopGesture(hands);
}

function calculateDynamics(leftPos, rightPos) {
    let movement = 0;
    if (leftPos && previousHandPositions.left) {
        movement += Math.hypot(leftPos.x - previousHandPositions.left.x, leftPos.y - previousHandPositions.left.y);
    }
    if (rightPos && previousHandPositions.right) {
        movement += Math.hypot(rightPos.x - previousHandPositions.right.x, rightPos.y - previousHandPositions.right.y);
    }
    previousHandPositions.left = leftPos;
    previousHandPositions.right = rightPos;

    speedHistory.push(movement);
    speedHistory.shift();
    frameCount++;

    const energyBar = document.getElementById('energy-bar-fill');
    const bpmDisplay = document.getElementById('bpm-display');
    const statusMsg = document.getElementById('status-msg');

    // Update playback rate every HISTORY_SIZE frames (every 1.5 seconds)
    if (frameCount >= HISTORY_SIZE) {
        frameCount = 0;

        const avgSpeed = speedHistory.reduce((a,b)=>a+b, 0) / HISTORY_SIZE;
        const energy = Math.min((avgSpeed - STOP_THRESHOLD) * 30, 1);

        if (avgSpeed < STOP_THRESHOLD) {
            currentPlaybackRate = 0.5;
        } else {
            currentPlaybackRate = 0.5 + (energy * 1.5); // ranges from 0.5 to 2.0
        }

        // Update all players with the new rate
        if (channels.drum) channels.drum.playbackRate = currentPlaybackRate;
        if (channels.piano) channels.piano.playbackRate = currentPlaybackRate;
        if (channels.strings) channels.strings.playbackRate = currentPlaybackRate;
        if (channels.wind) channels.wind.playbackRate = currentPlaybackRate;
    }

    // Calculate current average for display (but don't update playback rate)
    const avgSpeed = speedHistory.reduce((a,b)=>a+b, 0) / HISTORY_SIZE;
    const energy = Math.min((avgSpeed - STOP_THRESHOLD) * 30, 1);

    if (avgSpeed < STOP_THRESHOLD) {
        Tone.Destination.volume.rampTo(-Infinity, 0.5);
        energyBar.style.width = "0%";
        energyBar.style.opacity = "0.2";
        bpmDisplay.innerText = "SILENCE";
        statusMsg.innerText = "";
    } else {
        if(Tone.Transport.state !== 'started') Tone.Transport.start();
        Tone.Destination.volume.rampTo(0, 0.02);

        const targetBpm = MIN_BPM + (energy * (MAX_BPM - MIN_BPM));
        Tone.Transport.bpm.rampTo(targetBpm, 0.1);

        energyBar.style.width = `${energy*100}%`;
        energyBar.style.opacity = "1";
        bpmDisplay.innerText = `${Math.round(targetBpm)} BPM (${currentPlaybackRate.toFixed(2)}x)`;
        statusMsg.innerText = "CONDUCTING...";
    }
}

function updateChannelSwitches(hands, handedness) {
    // 检测左右手的食指和中指状态
    let status = {
        left_index: false,
        left_middle: false,
        right_index: false,
        right_middle: false
    };

    hands.forEach((lm, i) => {
        const label = handedness[i].label;
        const wrist = lm[0];

        // 因为摄像头镜像效果，MediaPipe的label需要反过来理解：
        // MediaPipe 'Right' = 用户的左手 = 控制左边人物
        // MediaPipe 'Left' = 用户的右手 = 控制右边人物
        const isUserLeftHand = label === 'Right';
        const isUserRightHand = label === 'Left';

        // 食指检测 (landmark 5,6,7,8)
        const indexTip = lm[8];
        const indexPip = lm[6];
        const indexDistTip = Math.hypot(indexTip.x-wrist.x, indexTip.y-wrist.y);
        const indexDistPip = Math.hypot(indexPip.x-wrist.x, indexPip.y-wrist.y);
        const indexExtended = indexDistTip > indexDistPip + 0.05;

        // 中指检测 (landmark 9,10,11,12)
        const middleTip = lm[12];
        const middlePip = lm[10];
        const middleDistTip = Math.hypot(middleTip.x-wrist.x, middleTip.y-wrist.y);
        const middleDistPip = Math.hypot(middlePip.x-wrist.x, middlePip.y-wrist.y);
        const middleExtended = middleDistTip > middleDistPip + 0.05;

        if (isUserLeftHand) {
            // 用户左手控制左边人物
            status.left_index = indexExtended;
            status.left_middle = middleExtended;
        } else if (isUserRightHand) {
            // 用户右手控制右边人物
            status.right_index = indexExtended;
            status.right_middle = middleExtended;
        }
    });

    // 更新音频通道 - 映射到4个音频文件
    const t = 0.1;
    // 左手食指 → drum
    channels.drum.volume.rampTo(status.left_index ? 0 : -Infinity, t);
    // 左手中指 → piano
    channels.piano.volume.rampTo(status.left_middle ? 0 : -Infinity, t);
    // 右手食指 → strings
    channels.strings.volume.rampTo(status.right_index ? 0 : -Infinity, t);
    // 右手中指 → wind
    channels.wind.volume.rampTo(status.right_middle ? 0 : -Infinity, t);

    // 更新UI指示器
    document.getElementById('ch-left-index').classList.toggle('active', status.left_index);
    document.getElementById('ch-left-middle').classList.toggle('active', status.left_middle);
    document.getElementById('ch-right-index').classList.toggle('active', status.right_index);
    document.getElementById('ch-right-middle').classList.toggle('active', status.right_middle);

    // 更新人物位置和图片
    const characters = document.querySelectorAll('.character');
    const riseAmount = window.innerHeight * 0.25;

    characters.forEach(char => {
        const finger = char.dataset.finger;
        const originalTop = parseFloat(char.dataset.originalTop);
        const wasActive = char.dataset.isActive === 'true';
        const isNowActive = status[finger];

        if (isNowActive) {
            // 手指active，人物上升并切换到激活图片
            char.style.top = `${originalTop - riseAmount}px`;
            if (!wasActive) {
                char.style.backgroundImage = `url('${CHARACTER_IMAGES.active}')`;
                char.dataset.isActive = 'true';
            }
        } else {
            // 手指不active，人物回到原位并切换到静止图片
            char.style.top = `${originalTop}px`;
            if (wasActive) {
                char.style.backgroundImage = `url('${CHARACTER_IMAGES.inactive}')`;
                char.dataset.isActive = 'false';
            }
        }
    });
}

function checkStopGesture(hands) {
    if (hands.length === 1) {
        const wrist = hands[0][0];
        let folded = 0;
        [8,12,16,20].forEach(i => {
            const d = Math.hypot(hands[0][i].x-wrist.x, hands[0][i].y-wrist.y);
            if (d < 0.15) folded++;
        });
        if (folded >= 4) {
            fistHoldFrameCount++;
            if (fistHoldFrameCount > 60) finishPerformance();
        } else {
            fistHoldFrameCount = 0;
        }
    }
}

async function finishPerformance() {
    currentState = 'VISUALIZING';
    document.getElementById('hud-panel').classList.add('hidden');
    document.getElementById('energy-container').classList.add('hidden');

    // 淡出人物和椭圆
    const characters = document.querySelectorAll('.character');
    characters.forEach(char => {
        char.style.opacity = '0';
    });
    document.getElementById('stage-ellipse').style.opacity = '0';
    document.getElementById('stage-ellipse').style.transition = 'opacity 1s';

    Tone.Transport.stop();
    const blob = await recorder.stop();
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a'); a.href = url; a.download = 'noir_symphony.webm'; a.click();

    const player = new Tone.Player(url).toDestination();
    player.autostart = true; player.loop = true;
    analyser = new Tone.Analyser("fft", 1024);
    player.connect(analyser);

    createCosmos();
}

function createCosmos() {
    handMeshes.left.hide(); handMeshes.right.hide();

    // 改变背景为深色
    document.getElementById('paper-background').style.background = 'linear-gradient(to bottom, #1a1a1a 0%, #0a0a0a 100%)';

    const count = 30000;
    const geo = new THREE.BufferGeometry();
    const pos = []; const col = [];
    const c1 = new THREE.Color(0xd4a574), c2 = new THREE.Color(0x8b6f47);

    for(let i=0; i<count; i++) {
        let x = Math.random()*50-25;
        let y = Math.random()*50-25;
        let z = Math.random()*50-25;
        pos.push(x,y,z);
        const dist = Math.sqrt(x*x+y*y+z*z);
        const mixed = c1.clone().lerp(c2, dist/30);
        col.push(mixed.r, mixed.g, mixed.b);
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

    const mat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
    particleSystem = new THREE.Points(geo, mat);
    scene.add(particleSystem);
}

const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
hands.onResults(processConducting);

function animate() {
    requestAnimationFrame(animate);
    if (currentState === 'VISUALIZING' && particleSystem) {
        particleSystem.rotation.y += 0.002;
        const val = analyser.getValue()[10];
        const scale = 1 + (val+100)/150;
        particleSystem.scale.setScalar(scale);
    }
    renderer.render(scene, camera);
}

document.getElementById('start-btn').addEventListener('click', async () => {
    const btn = document.getElementById('start-btn');
    btn.innerText = 'LOADING...';
    btn.disabled = true;

    document.getElementById('center-controls').classList.add('hidden');
    document.getElementById('hud-panel').classList.remove('hidden');
    document.getElementById('energy-container').classList.remove('hidden');

    // 创建人物
    createCharacters();

    initThree();

    try {
        await initAudio();

        const video = document.getElementById('video-element');
        const stageVideo = document.getElementById('stage-video');

        const cam = new Camera(video, {
            onFrame: async () => {
                // 同步视频流到舞台视频元素
                if (video.srcObject && !stageVideo.srcObject) {
                    stageVideo.srcObject = video.srcObject;
                }
                await hands.send({image: video});
            },
            width: 1280, height: 720
        });
        await cam.start();
        recorder.start();
        currentState = 'CONDUCTING';
        animate();
    } catch(error) {
        alert('Error: ' + error.message);
        console.error(error);
    }
});
</script>
